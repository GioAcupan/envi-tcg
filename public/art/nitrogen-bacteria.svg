  <rect x="40" y="38" width="38" height="16" rx="8" transform="rotate(-18 40 38)" fill="#A83868" stroke="#1B221B" stroke-width="2"/>
  <rect x="76" y="64" width="40" height="16" rx="8" transform="rotate(14 76 64)" fill="#C25283" stroke="#1B221B" stroke-width="2"/>
