  <path d="M44 78C38 50 62 30 92 34C116 38 126 56 116 72C106 62 94 54 76 56C60 58 52 68 44 78Z" fill="#D9820B" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
