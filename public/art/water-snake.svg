<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Water Snake: Banded riparian water snake (Nerodia) swimming in an S-curve -->
  <rect width="160" height="120" rx="6" fill="#EAF2EE"/>
  <!-- Water surface wake ripples -->
  <path d="M14 98H68M88 94H146M22 28H56" stroke="#0D7A8A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Forked red tongue -->
  <path d="M140 43L150 40M150 40L155 36M150 40L155 43" stroke="#B42318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tail tip on left -->
  <path d="M24 82L10 92L26 90Z" fill="#8C6239" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Serpentine S-curve body (outer ink border + warm brown body + dark dorsal bands) -->
  <path d="M22 86C28 66 44 34 64 34C86 34 86 78 108 78C122 78 126 60 130 48" stroke="#1B221B" stroke-width="15" stroke-linecap="round"/>
  <!-- Diamond snake head (outlined) -->
  <path d="M122 50C122 42 132 37 141 41C144 43 144 47 139 50C132 54 124 54 122 50Z" fill="#8C6239" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Inner brown body & dark dorsal crossband saddles (drawn over neck seam for a unified silhouette!) -->
  <path d="M22 86C28 66 44 34 64 34C86 34 86 78 108 78C122 78 126 60 130 48" stroke="#8C6239" stroke-width="11" stroke-linecap="round"/>
  <path d="M28 74C34 56 48 34 64 34C86 34 86 78 108 78C120 78 125 64 128 53" stroke="#432818" stroke-width="11" stroke-dasharray="6 10"/>
  <!-- Alert yellow snake eye -->
  <circle cx="134" cy="44" r="2.5" fill="#FDE68A" stroke="#1B221B" stroke-width="1.2"/>
  <line x1="134" y1="42.2" x2="134" y2="45.8" stroke="#1B221B" stroke-width="1.2"/>
</svg>
