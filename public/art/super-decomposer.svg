<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Super Decomposer: Multi-cap saprophytic fungus cluster releasing C, N, P nutrients -->
  <rect width="160" height="120" rx="6" fill="#FCF0F5"/>
  <!-- Golden nutrient-recycling aura ring -->
  <circle cx="80" cy="60" r="46" fill="#F5DCE8" stroke="#D9820B" stroke-width="2.2" stroke-dasharray="6 3"/>
  <!-- Humus & decaying log base -->
  <path d="M28 96C56 90 104 90 132 96L126 106H34L28 96Z" fill="#5C4024" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Three mushroom stalks -->
  <path d="M46 94V72H54V94M75 94V58H85V94M106 94V70H114V94" fill="#FAF6EC" stroke="#1B221B" stroke-width="2"/>
  <!-- Left & right side mushroom caps -->
  <path d="M32 74C32 58 68 58 68 74H32Z" fill="#A83868" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M92 72C92 56 128 56 128 72H92Z" fill="#A83868" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Central tall mushroom cap (drawn over side cap edges cleanly) -->
  <path d="M54 60C54 38 106 38 106 60H54Z" fill="#7D234A" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="72" cy="49" r="3" fill="#FAF6EC"/>
  <circle cx="86" cy="47" r="2.5" fill="#FAF6EC"/>
  <circle cx="48" cy="66" r="2" fill="#FAF6EC"/>
  <circle cx="112" cy="64" r="2" fill="#FAF6EC"/>
  <!-- Released C (hexagon), N (diamond), and P (triangle) badges cleanly spaced in upper arc -->
  <polygon points="48,26 56,31 56,40 48,45 40,40 40,31" fill="#2E3D30" stroke="#1B221B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="80,16 89,25 80,34 71,25" fill="#1E5AA8" stroke="#1B221B" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="112,25 121,41 103,41" fill="#C6690A" stroke="#1B221B" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
