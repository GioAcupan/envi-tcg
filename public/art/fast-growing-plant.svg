  <rect width="160" height="120" rx="6" fill="#F6F2E4"/>
  <!-- Rich soil mound -->
  <path d="M16 106C50 98 110 98 144 106H16Z" fill="#7A5835" stroke="#1B221B" stroke-width="2"/>
  <!-- Upward golden growth arrows -->
  <g stroke="#D9820B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 62V32M25 40L32 32L39 40"/>
    <path d="M128 54V24M121 32L128 24L135 32"/>
  </g>
  <!-- Main vigorous stem -->
  <path d="M80 100C80 76 78 48 80 20" stroke="#1B221B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lower leaf pair -->
  <path d="M80 84C56 84 40 70 44 56C58 56 74 68 80 84Z" fill="#3A7537" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80 80C104 80 120 66 116 52C102 52 86 64 80 80Z" fill="#4E8C4A" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Middle leaf pair -->
  <path d="M79 58C58 56 46 42 52 30C64 32 75 44 79 58Z" fill="#52944E" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80 54C102 52 114 38 108 26C96 28 85 40 80 54Z" fill="#68A864" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Leaf midribs -->
  <path d="M78 82L54 64M82 78L106 60M78 56L60 40M82 52L100 36" stroke="#1B221B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Apical crown shoot bud -->
  <path d="M80 28C72 20 74 10 80 8C86 10 88 20 80 28Z" fill="#84CC16" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
</svg>
