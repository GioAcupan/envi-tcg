<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Diatom: Ornate geometric silica frustules (pennate & centric microalgae) -->
  <rect width="160" height="120" rx="6" fill="#EBF5F5"/>
  <!-- Microscope field ring -->
  <circle cx="80" cy="60" r="48" fill="#D5ECEB" stroke="#1F6E7A" stroke-width="2"/>
  <!-- Pennate diatom (boat-shaped silica shell) -->
  <path d="M36 60C54 40 106 40 124 60C106 80 54 80 36 60Z" fill="#EAB308" stroke="#1B221B" stroke-width="2.2"/>
  <path d="M44 60H116" stroke="#1B221B" stroke-width="2"/>
  <!-- Silica striae ribs -->
  <path d="M60 49V71M72 46V74M80 45V75M88 46V74M100 49V71" stroke="#78350F" stroke-width="1.6"/>
  <!-- Small centric diatom in corner -->
  <circle cx="52" cy="30" r="10" fill="#68A864" stroke="#1B221B" stroke-width="1.8"/>
  <circle cx="52" cy="30" r="4" fill="#FEF3C7" stroke="#1B221B" stroke-width="1.2"/>
  <circle cx="110" cy="90" r="9" fill="#52944E" stroke="#1B221B" stroke-width="1.8"/>
</svg>
