<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Diatom: Ornate geometric silica frustules (pennate naviculoid & radial centric diatoms) -->
  <rect width="160" height="120" rx="6" fill="#EBF5F5"/>
  <!-- Microscope field ring -->
  <circle cx="80" cy="60" r="48" fill="#D5ECEB" stroke="#1F6E7A" stroke-width="2"/>
  <circle cx="80" cy="60" r="43" stroke="#0D7A8A" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Pennate diatom (diagonal naviculoid boat frustule with raphe & striae) -->
  <g transform="rotate(-22 68 62)">
    <path d="M24 62C42 42 94 42 112 62C94 82 42 82 24 62Z" fill="#EAB308" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M32 62C46 48 90 48 104 62C90 76 46 76 32 62Z" fill="#FDE68A" stroke="#78350F" stroke-width="1.4"/>
    <!-- Central raphe & nodule -->
    <path d="M34 62H63M73 62H102" stroke="#1B221B" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="68" cy="62" r="3.5" fill="#D97706" stroke="#1B221B" stroke-width="1.5"/>
    <!-- Transverse silica striae ribs fitted strictly inside valve -->
    <path d="M46 54V70M56 51V73M80 51V73M90 54V70" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Radial centric diatom (ornate wheel frustule at lower right) -->
  <circle cx="104" cy="80" r="15" fill="#52944E" stroke="#1B221B" stroke-width="2"/>
  <circle cx="104" cy="80" r="10" fill="#BEF264" stroke="#1B221B" stroke-width="1.5"/>
  <path d="M104 65V95M89 80H119M93 69L115 91M115 69L93 91" stroke="#1B221B" stroke-width="1.3"/>
  <circle cx="104" cy="80" r="4" fill="#EAB308" stroke="#1B221B" stroke-width="1.5"/>
</svg>
