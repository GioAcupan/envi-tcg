  <path d="M98 68C104 46 88 26 66 28C44 30 32 48 38 66C42 78 58 82 76 80C90 78 96 74 98 68Z" fill="#B45309" stroke="#1B221B" stroke-width="2.2"/>
  <!-- Inner spiral suture & growth bands -->
