<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Freshwater Snail: Aquatic pond/ramshorn snail grazing green algae off a submerged stone -->
  <rect width="160" height="120" rx="6" fill="#E8F4F2"/>
  <!-- Submerged river cobble with green algal biofilm -->
  <path d="M16 104C22 80 138 80 144 104H16Z" fill="#9AA89C" stroke="#1B221B" stroke-width="2"/>
  <path d="M24 94C46 82 114 82 136 94C112 90 48 90 24 94Z" fill="#52944E"/>
