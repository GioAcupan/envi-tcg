<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Freshwater Snail: Ramshorn / Physa grazer snail scraping green biofilm off a river pebble -->
  <rect width="160" height="120" rx="6" fill="#E8F4F2"/>
  <!-- Algae-coated river cobble -->
  <path d="M20 98C28 76 132 76 140 98H20Z" fill="#68A864" stroke="#1B221B" stroke-width="2"/>
