  <path d="M44 66L92 32C108 42 110 66 92 76L44 66Z" fill="#9E420B" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M62 54L74 72M78 43L90 68" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
  <!-- Grazer foot & tentacles -->
  <path d="M54 80H116C122 80 124 72 116 70H60L54 80Z" fill="#5C4024" stroke="#1B221B" stroke-width="2"/>
  <path d="M118 71L132 60M114 71L126 56" stroke="#1B221B" stroke-width="2" stroke-linecap="round"/>
</svg>
