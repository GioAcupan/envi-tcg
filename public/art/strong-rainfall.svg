<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Strong Rainfall: Heavy storm cloud, driving rain, and phosphorus (P) watershed runoff -->
  <rect width="160" height="120" rx="6" fill="#EFF7EE"/>
  <!-- Storm cloud -->
  <path d="M40 48C30 48 24 40 26 32C28 22 38 18 46 22C52 12 68 10 78 18C88 10 106 12 112 24C124 24 132 32 130 42C128 48 120 48 112 48H40Z" fill="#64748B" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Slanting rain streaks -->
  <g stroke="#1E5AA8" stroke-width="2.5" stroke-linecap="round">
    <line x1="46" y1="56" x2="36" y2="82"/>
    <line x1="68" y1="56" x2="58" y2="82"/>
    <line x1="90" y1="56" x2="80" y2="82"/>
    <line x1="112" y1="56" x2="102" y2="82"/>
  </g>
  <!-- Runoff wave & +2 P mineral triangles -->
  <path d="M0 94C36 88 72 100 108 94C132 90 148 94 160 96V120H0V94Z" fill="#0D7A8A" stroke="#1B221B" stroke-width="2"/>
  <polygon points="56,84 68,106 44,106" fill="#C6690A" stroke="#1B221B" stroke-width="1.8"/>
  <polygon points="104,84 116,106 92,106" fill="#C6690A" stroke="#1B221B" stroke-width="1.8"/>
</svg>
