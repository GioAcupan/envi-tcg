  <!-- Rear & front dark storm clouds -->
  <path d="M56 42C48 42 42 36 44 28C46 20 56 16 64 20C70 10 86 8 96 16C106 10 122 12 126 22C136 22 142 30 140 38C138 42 132 42 124 42H56Z" fill="#475569" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 48C16 48 12 40 14 32C16 22 26 18 34 22C40 12 56 10 66 18C76 12 92 14 98 24C108 24 116 32 114 42C112 48 104 48 96 48H26Z" fill="#64748B" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Driving rain sheets -->
  <g stroke="#1E5AA8" stroke-width="2.2" stroke-linecap="round">
    <line x1="34" y1="54" x2="22" y2="82"/>
    <line x1="52" y1="54" x2="40" y2="84"/>
    <line x1="70" y1="54" x2="58" y2="86"/>
    <line x1="88" y1="54" x2="76" y2="84"/>
