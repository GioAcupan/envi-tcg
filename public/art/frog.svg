<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Frog: Riparian leopard/green frog crouched on a river stone -->
  <rect width="160" height="120" rx="6" fill="#EEF5EC"/>
  <!-- Shallow water ripples & mossy river stone -->
  <path d="M12 104H148" stroke="#0D7A8A" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="80" cy="96" rx="54" ry="13" fill="#9AA89C" stroke="#1B221B" stroke-width="2"/>
  <!-- Z-folded muscular hind jumping leg & webbed foot -->
  <path d="M36 78C30 64 42 54 58 60C68 64 70 76 62 84L42 90L30 88C34 84 40 84 46 84L36 78Z" fill="#3A7537" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 74L56 80" stroke="#1B221B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Far-side planted foreleg -->
  <path d="M102 72L108 88L116 89L106 91L100 74Z" fill="#3A7537" stroke="#1B221B" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Unified frog torso, head & snout silhouette -->
  <path d="M44 82C42 62 60 46 84 44C96 43 108 46 118 54C124 59 124 66 116 70C106 76 94 84 74 86C56 87 45 86 44 82Z" fill="#52944E" stroke="#1B221B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Cream vocal sac / throat & belly shading -->
  <path d="M72 85C88 84 104 77 115 69C108 64 96 65 86 71C78 76 74 81 72 85Z" fill="#FDE68A" stroke="#1B221B" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Golden dorsolateral ridge & dark leopard spots -->
  <path d="M48 72C62 56 82 50 100 50" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="64" cy="64" rx="5" ry="3.2" transform="rotate(-15 64 64)" fill="#233127"/>
  <ellipse cx="78" cy="58" rx="4.5" ry="3" transform="rotate(-10 78 58)" fill="#233127"/>
  <circle cx="56" cy="73" r="3" fill="#233127"/>
  <!-- Near-side planted foreleg with webbed toes (unified closed polygon, no stroke caps!) -->
  <path d="M84 74C88 72 93 74 94 78L97 90L105 92L96 94L91 96L89 91L85 78Z" fill="#52944E" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Prominent bulging amphibian eye & tympanum -->
  <circle cx="102" cy="44" r="7.5" fill="#68A864" stroke="#1B221B" stroke-width="2"/>
  <circle cx="103" cy="44" r="4.5" fill="#FDE68A" stroke="#1B221B" stroke-width="1.4"/>
  <ellipse cx="103.5" cy="44" rx="2.5" ry="1.6" fill="#1B221B"/>
  <circle cx="93" cy="54" r="3.2" fill="#3A7537" stroke="#1B221B" stroke-width="1.4"/>
</svg>
