<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Frog: Riparian leopard/green frog crouched on a river stone -->
  <rect width="160" height="120" rx="6" fill="#EEF5EC"/>
  <!-- River stone base -->
  <ellipse cx="80" cy="96" rx="52" ry="14" fill="#9AA89C" stroke="#1B221B" stroke-width="2"/>
  <!-- Folded hind leg -->
  <path d="M44 86C32 74 36 58 54 64L62 88H40Z" fill="#3A7537" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Torso & throat -->
  <ellipse cx="78" cy="70" rx="30" ry="20" transform="rotate(-12 78 70)" fill="#52944E" stroke="#1B221B" stroke-width="2.2"/>
  <path d="M84 58C98 62 108 72 100 82C88 86 72 82 66 74" fill="#FDE68A" stroke="#1B221B" stroke-width="1.8"/>
  <!-- Front legs -->
  <path d="M90 78L96 94M102 74L112 92" stroke="#3A7537" stroke-width="4" stroke-linecap="round"/>
  <!-- Prominent frog eyes -->
  <circle cx="94" cy="48" r="8" fill="#68A864" stroke="#1B221B" stroke-width="2"/>
  <circle cx="96" cy="48" r="4" fill="#1B221B"/>
  <circle cx="97" cy="46.5" r="1.3" fill="#FFFFFF"/>
  <!-- Dorsal spots -->
  <circle cx="68" cy="64" r="3.5" fill="#233127"/>
  <circle cx="58" cy="72" r="3" fill="#233127"/>
</svg>
