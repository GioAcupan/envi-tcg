<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Green Algae: Undulating multicellular Spirogyra filaments & colonial chlorophytes -->
  <rect width="160" height="120" rx="6" fill="#E6F4F1"/>
  <!-- Microscope droplet medallion -->
  <circle cx="80" cy="60" r="48" fill="#C7ECE4" stroke="#0D7A8A" stroke-width="2"/>
  <circle cx="80" cy="60" r="43" stroke="#0D7A8A" stroke-width="1" stroke-dasharray="5 3"/>
  <!-- Primary undulating multicellular filament (outlined ribbon with cell walls & spiral chloroplasts) -->
  <path d="M38 82C48 60 68 66 80 46C90 30 108 34 118 22" stroke="#1B221B" stroke-width="13" stroke-linecap="round"/>
  <path d="M38 82C48 60 68 66 80 46C90 30 108 34 118 22" fill="none" stroke="#84CC16" stroke-width="9" stroke-linecap="round"/>
  <path d="M38 82C48 60 68 66 80 46C90 30 108 34 118 22" fill="none" stroke="#2E6F40" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 7"/>
  <!-- Second sinuous algal filament -->
  <path d="M44 38C60 36 70 54 86 64C102 74 106 88 120 88" stroke="#1B221B" stroke-width="11" stroke-linecap="round"/>
  <path d="M44 38C60 36 70 54 86 64C102 74 106 88 120 88" fill="none" stroke="#52944E" stroke-width="7" stroke-linecap="round"/>
  <path d="M44 38C60 36 70 54 86 64C102 74 106 88 120 88" fill="none" stroke="#BEF264" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 6"/>
  <!-- Colonial Volvox-style green algae sphere -->
  <circle cx="108" cy="54" r="12" fill="#68A864" stroke="#1B221B" stroke-width="2"/>
  <circle cx="104" cy="50" r="3" fill="#2E6F40"/>
  <circle cx="112" cy="52" r="2.5" fill="#2E6F40"/>
  <circle cx="107" cy="58" r="2.8" fill="#2E6F40"/>
  <!-- Photosynthetic O2 micro-bubbles -->
  <circle cx="54" cy="58" r="4" fill="#FAF6EC" stroke="#0D7A8A" stroke-width="1.5"/>
  <circle cx="72" cy="86" r="5" fill="#FAF6EC" stroke="#0D7A8A" stroke-width="1.6"/>
</svg>
