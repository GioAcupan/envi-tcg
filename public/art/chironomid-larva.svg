<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Chironomid Larva: Segmented crimson bloodworm (midge larva) over benthic silt -->
  <rect width="160" height="120" rx="6" fill="#F4EFE4"/>
  <!-- Benthic silt floor -->
  <path d="M10 98C52 92 108 92 150 98" stroke="#8C6239" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Posterior prolegs & four anal blood-gill tubules at tail (left) -->
  <path d="M40 74L28 82M42 78L34 88" stroke="#7F1D1D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 68C28 64 24 58 28 54M39 71C28 70 22 66 25 61" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <!-- Segmented C-curved crimson larva body (overlapping metameric segments) -->
  <g stroke="#1B221B" stroke-width="1.8">
    <circle cx="44" cy="70" r="8.5" fill="#B91C1C"/>
    <circle cx="42" cy="57" r="9" fill="#DC2626"/>
    <circle cx="46" cy="44" r="9.5" fill="#EF4444"/>
    <circle cx="56" cy="35" r="9.5" fill="#DC2626"/>
    <circle cx="70" cy="30" r="10" fill="#EF4444"/>
    <circle cx="84" cy="30" r="10" fill="#DC2626"/>
    <circle cx="98" cy="35" r="9.5" fill="#EF4444"/>
    <circle cx="108" cy="45" r="9.5" fill="#DC2626"/>
    <circle cx="112" cy="58" r="9" fill="#B91C1C"/>
  </g>
  <!-- Anterior thoracic prolegs beneath neck -->
  <path d="M106 66L98 76M110 68L104 79" stroke="#7F1D1D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dark sclerotized head capsule, eye spot & short antennae -->
  <ellipse cx="114" cy="69" rx="8.5" ry="7" transform="rotate(25 114 69)" fill="#432818" stroke="#1B221B" stroke-width="2"/>
  <circle cx="117" cy="68" r="1.8" fill="#FDE68A"/>
  <path d="M121 72L128 76M119 75L125 80" stroke="#1B221B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
