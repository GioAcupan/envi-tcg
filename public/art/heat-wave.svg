  <!-- Rising shimmer heat waves -->
  <path d="M36 92C28 76 44 60 36 44C28 28 44 16 36 12" stroke="#C85A17" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M64 92C56 76 72 60 64 44C56 28 72 16 64 12" stroke="#B42318" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M124 92C116 76 132 60 124 44C116 28 132 16 124 12" stroke="#C85A17" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Field thermometer at max -->
  <rect x="88" y="18" width="14" height="64" rx="7" fill="#FAF6EC" stroke="#1B221B" stroke-width="2.2"/>
  <circle cx="95" cy="86" r="14" fill="#B42318" stroke="#1B221B" stroke-width="2.2"/>
  <rect x="92" y="26" width="6" height="56" rx="3" fill="#B42318"/>
