<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Predatory Insect: Riparian dragonfly / damselfly with veined wings -->
  <rect width="160" height="120" rx="6" fill="#F5F1E4"/>
  <!-- Four translucent veined wings -->
  <ellipse cx="52" cy="44" rx="34" ry="9" transform="rotate(-14 52 44)" fill="#DBEAFE" stroke="#1B221B" stroke-width="1.8"/>
  <ellipse cx="108" cy="44" rx="34" ry="9" transform="rotate(14 108 44)" fill="#DBEAFE" stroke="#1B221B" stroke-width="1.8"/>
  <ellipse cx="50" cy="62" rx="32" ry="8" transform="rotate(8 50 62)" fill="#E0F2FE" stroke="#1B221B" stroke-width="1.8"/>
  <ellipse cx="110" cy="62" rx="32" ry="8" transform="rotate(-8 110 62)" fill="#E0F2FE" stroke="#1B221B" stroke-width="1.8"/>
  <!-- Thorax & segmented abdomen -->
  <rect x="76" y="48" width="8" height="54" rx="4" fill="#0D7A8A" stroke="#1B221B" stroke-width="2"/>
  <path d="M76 64H84M76 74H84M76 84H84M76 94H84" stroke="#1B221B" stroke-width="1.6"/>
  <ellipse cx="80" cy="46" rx="9" ry="11" fill="#1F6E7A" stroke="#1B221B" stroke-width="2"/>
  <!-- Compound eyes -->
  <circle cx="75" cy="32" r="6" fill="#C85A17" stroke="#1B221B" stroke-width="2"/>
  <circle cx="85" cy="32" r="6" fill="#C85A17" stroke="#1B221B" stroke-width="2"/>
</svg>
