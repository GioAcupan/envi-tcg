<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Emergent Plant: Cattail (Typha) and wetland reeds rooted underwater with stems rising into the air -->
  <rect width="160" height="120" rx="6" fill="#EAF4F4"/>
  <!-- Submerged water column & benthic sediment -->
  <path d="M0 70C32 67 64 73 96 70C128 67 144 72 160 70V120H0V70Z" fill="#B5DEE6"/>
  <path d="M8 70H152" stroke="#0D7A8A" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M0 104C44 96 116 96 160 104V120H0V104Z" fill="#7A5835" stroke="#1B221B" stroke-width="2"/>
  <!-- Submerged rhizome & anchoring roots -->
  <path d="M54 104C68 102 92 102 106 104" stroke="#5C4024" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M62 103L52 115M72 103L68 116M82 103L84 116M94 103L102 115" stroke="#1B221B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arching emergent reed blades crossing the water surface -->
  <path d="M62 102C56 76 44 50 28 28C46 44 58 72 66 102Z" fill="#3A7537" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M96 102C102 74 114 48 132 26C116 46 104 72 92 102Z" fill="#2E6F40" stroke="#1B221B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M74 102C68 74 58 48 48 22C62 44 72 72 78 102Z" fill="#52944E" stroke="#1B221B" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M86 102C92 76 102 52 114 34C100 54 92 76 82 102Z" fill="#68A864" stroke="#1B221B" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Upright cattail stalks rising from submerged roots above water -->
  <path d="M72 103V12M90 103V22" stroke="#1B221B" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Cattail spikes (dark brown pistillate cylinders + golden staminate tips) -->
  <rect x="67" y="20" width="10" height="26" rx="5" fill="#7C4D25" stroke="#1B221B" stroke-width="2"/>
  <path d="M72 10V20" stroke="#D9820B" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="85.5" y="30" width="9" height="22" rx="4.5" fill="#7C4D25" stroke="#1B221B" stroke-width="2"/>
  <path d="M90 21V30" stroke="#D9820B" stroke-width="3" stroke-linecap="round"/>
  <!-- Underwater O2 bubble -->
  <circle cx="36" cy="86" r="4" fill="#FAF6EC" stroke="#0D7A8A" stroke-width="1.6"/>
</svg>
