<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Caddisfly Larva: larva peeking from its portable case of sand grains and leaf bits over benthic silt -->
  <rect width="160" height="120" rx="6" fill="#F4EFE4"/>
  <!-- Benthic silt floor -->
  <path d="M10 98C52 92 108 92 150 98" stroke="#8C6239" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tapered tube case, lying on the silt -->
  <path d="M26 72C26 62 34 56 46 56L104 52C112 52 116 58 116 66C116 74 112 80 104 80L46 82C34 82 26 80 26 72Z" fill="#C8A26B" stroke="#1B221B" stroke-width="1.8"/>
  <!-- Sand grains and pebbles glued to the case -->
  <g stroke="#1B221B" stroke-width="1.2">
    <circle cx="38" cy="66" r="4" fill="#A47C48"/>
    <circle cx="48" cy="74" r="4.5" fill="#D9C29A"/>
    <circle cx="58" cy="63" r="5" fill="#8C6239"/>
    <circle cx="70" cy="73" r="4.5" fill="#A47C48"/>
    <circle cx="80" cy="62" r="4" fill="#D9C29A"/>
    <circle cx="92" cy="71" r="5" fill="#8C6239"/>
    <circle cx="104" cy="62" r="3.5" fill="#D9C29A"/>
  </g>
  <!-- Leaf fragments woven into the case -->
  <path d="M60 78L74 80L66 84Z" fill="#4D7C3A" stroke="#1B221B" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M84 54L96 52L90 58Z" fill="#6B8F3A" stroke="#1B221B" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Soft larva body emerging from the case mouth -->
  <path d="M114 60C122 56 130 56 134 60C138 64 136 70 130 72C124 74 118 72 114 70" fill="#E9D8A6" stroke="#1B221B" stroke-width="1.8"/>
  <!-- Thoracic legs -->
  <path d="M122 72L118 84M128 72L126 85M133 69L136 81" stroke="#1B221B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Dark sclerotized head capsule and eye -->
  <ellipse cx="138" cy="62" rx="7" ry="6" fill="#3F2A1A" stroke="#1B221B" stroke-width="1.8"/>
  <circle cx="140" cy="60" r="1.4" fill="#F4EFE4"/>
</svg>
